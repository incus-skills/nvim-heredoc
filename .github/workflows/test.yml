name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 shfmt
      - name: Report runtime and parser oracle
        run: |
          lua5.1 -v
          shfmt --version
      - name: Validate unsupported-grammar fixtures with mvdan/sh
        run: |
          for fixture in tests/fixtures/grammar/*.sh; do
            echo "Parsing $fixture"
            shfmt -ln=bash --to-json < "$fixture" >/dev/null
          done
      - name: Check local diagnostic script syntax
        run: bash -n tests/diagnostics/inspect-lazyvim.sh
      - name: Run scanner tests
        run: bash tests/run-core.sh

  buffer-integration:
    name: Neovim buffer integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
      - name: Report Neovim version
        run: nvim --version | head -n 1
      - name: Run headless buffer tests
        run: bash tests/run-nvim.sh

  shell-delivery:
    name: shell delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shell matrix
        run: |
          sudo apt-get update
          sudo apt-get install --yes dash zsh
      - name: Report shell versions
        run: |
          bash --version | head -n 1
          dash -c 'echo "dash: available"'
          zsh --version
      - name: Compare delivered payload bytes
        run: bash tests/run-shell-delivery.sh

  formatter:
    name: shfmt payload preservation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install --yes shfmt
      - name: Report formatter version
        run: shfmt --version
      - name: Compare payload before and after formatting
        run: bash tests/formatter/test-shfmt.sh

  lazyvim-integration:
    name: LazyVim plugin coexistence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned integration container
        run: docker build --file ci/lazyvim/Dockerfile --tag nvim-heredoc-lazyvim-test .
      - name: Run headless LazyVim/plugin tests
        run: docker run --rm nvim-heredoc-lazyvim-test
